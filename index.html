<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birthday Envelope Card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Mono:wght@400;500&family=Gaegu:wght@400;700&display=swap">
<style>
/* Layout: one airmail envelope on a felt desk; the card rises out, drops in front, and tent-folds open upward. Single committed look. */
:root{
  color-scheme: dark;
  --felt:#1f3d36; --felt-deep:#152b26; --on-felt:#e6efe9; --on-felt-dim:#a9c0b7;
  --paper:#eef1ea; --paper-shade:#dde3d8; --paper-in:#cfd8cd;
  --red:#d6453d; --blue:#2f5d9e; --wax:#b3272d; --wax-hi:#d9484c;
  --card:#fffdf6; --card-shade:#f3eedf; --ink:#1c2a3a; --sun:#f4b63f; --pink:#ef7f9a;
  --display:"Bagel Fat One","Arial Black",Impact,sans-serif;
  --hand:"Gaegu","Comic Sans MS","Segoe Print",cursive;
  --mono:"DM Mono",ui-monospace,Consolas,monospace;
  --w:min(440px, calc(100vw - 48px));
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 90% at 50% 20%, #2a5148 0%, var(--felt) 45%, var(--felt-deep) 100%) fixed var(--felt);
  color:var(--on-felt); font-family:var(--mono);
  padding-inline:24px; padding-block:28px;
  display:flex; flex-direction:column; align-items:center; gap:14px;
  box-sizing:border-box; overflow-x:hidden;
}
.eyebrow{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--on-felt-dim); margin:0; text-align:center}

.stage{position:relative; width:var(--w); height:calc(var(--w)*1.7); flex:none}
.stage > *{position:absolute; left:0}

/* envelope pieces share one box */
.env{top:calc(var(--w)*.53); width:var(--w); height:calc(var(--w)*.64);
  transition:transform .8s cubic-bezier(.5,0,.7,.4), opacity .6s}
.env-back{z-index:1; background:var(--paper-in); border-radius:6px; box-shadow:0 18px 30px rgba(0,0,0,.35)}
.env-front{z-index:3; border-radius:6px; overflow:hidden;
  clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);
  background:repeating-linear-gradient(135deg,var(--red) 0 12px,var(--paper) 12px 24px,var(--blue) 24px 36px,var(--paper) 36px 48px)}
.env-front .fill{position:absolute; inset:9px; background:var(--paper-shade)}
.env-front .tri{position:absolute; inset:9px; background:var(--paper); clip-path:polygon(0 100%,50% 44%,100% 100%)}
.env-front .to{position:absolute; left:0; right:0; bottom:9%; text-align:center; color:var(--ink);
  font-family:var(--hand); font-weight:700; font-size:calc(var(--w)*.062)}
.flap{z-index:4; height:calc(var(--w)*.37); background:var(--paper); border-radius:6px 6px 0 0;
  clip-path:polygon(0 0,100% 0,50% 100%); transform-origin:50% 0;
  transform:perspective(900px) rotateX(0deg);
  transition:transform .6s ease-in-out, background-color .3s .15s, z-index 0s .3s, opacity .6s}
.flap::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 60%,rgba(28,42,58,.10))}

.seal{z-index:5; left:50%; top:calc(var(--w)*.83); width:calc(var(--w)*.17); height:calc(var(--w)*.17);
  margin-left:calc(var(--w)*-.085); border:0; border-radius:50%; cursor:pointer; padding:0;
  background:radial-gradient(circle at 35% 30%,var(--wax-hi),var(--wax) 60%);
  box-shadow:0 3px 6px rgba(0,0,0,.35), inset 0 0 0 4px rgba(255,255,255,.12);
  color:#ffe9e6; font-family:var(--display); font-size:calc(var(--w)*.075); line-height:1;
  transition:transform .3s, opacity .3s}
.seal:hover{transform:scale(1.08) rotate(-6deg)}
.seal:focus-visible, .btn:focus-visible, [contenteditable]:focus-visible{outline:3px solid var(--sun); outline-offset:3px}

/* the card */
.card{z-index:2; left:calc(var(--w)*.05); top:calc(var(--w)*.57); width:calc(var(--w)*.9); height:calc(var(--w)*.56);
  perspective:1400px; color:var(--ink);
  transition:transform .7s cubic-bezier(.3,.7,.3,1), z-index 0s .7s}
.panel{position:absolute; inset:0; background:var(--card); border-radius:5px; box-sizing:border-box;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  padding:calc(var(--w)*.045)}
.inside-bottom{box-shadow:0 10px 22px rgba(0,0,0,.3); flex-direction:row; gap:calc(var(--w)*.035);
  background:linear-gradient(180deg,var(--card-shade),var(--card) 18%)}
.words{display:flex; flex-direction:column; align-items:center; gap:calc(var(--w)*.015); min-width:0; flex:1}
.photo{flex:none; height:100%; aspect-ratio:1/1; padding:calc(var(--w)*.012); border:0; background:#fff; cursor:zoom-in;
  box-shadow:0 2px 8px rgba(28,42,58,.3); transform:rotate(-3deg); transition:transform .2s}
.photo:hover{transform:rotate(-1deg) scale(1.03)}
.photo:focus-visible{outline:3px solid var(--sun); outline-offset:3px}
.photo img{display:block; width:100%; height:100%; object-fit:cover; object-position:50% 92%}
.lightbox.on{display:flex}
.lightbox{position:fixed; inset:0; z-index:30; background:rgba(10,22,19,.88); display:none; align-items:center; justify-content:center;
  padding:20px; box-sizing:border-box; cursor:zoom-out; border:0}
.lightbox img{max-width:100%; max-height:100%; border:8px solid #fff; box-sizing:border-box; box-shadow:0 20px 50px rgba(0,0,0,.5)}
.leaf{position:absolute; inset:0; transform-style:preserve-3d; transform-origin:50% 0;
  transition:transform .9s cubic-bezier(.4,.1,.2,1)}
.leaf .panel{backface-visibility:hidden; -webkit-backface-visibility:hidden}
.cover{gap:calc(var(--w)*.02);
  background:radial-gradient(circle at 12% 18%,var(--pink) 0 5px,transparent 6px),
    radial-gradient(circle at 88% 26%,var(--sun) 0 6px,transparent 7px),
    radial-gradient(circle at 80% 82%,var(--blue) 0 4px,transparent 5px),
    radial-gradient(circle at 16% 78%,var(--red) 0 5px,transparent 6px),var(--card)}
.cover svg{width:34%; height:auto}
.cover p{margin:0; font-family:var(--hand); font-weight:700; font-size:calc(var(--w)*.062)}
.inside-top{transform:rotateX(180deg); background:linear-gradient(0deg,var(--card-shade),var(--card) 18%);
  box-shadow:0 -6px 18px rgba(0,0,0,.2)}
.inside-top h1{margin:0; font-family:var(--display); font-weight:400; line-height:.95; text-wrap:balance;
  font-size:calc(var(--w)*.15); color:var(--red); text-shadow:calc(var(--w)*.008) calc(var(--w)*.008) 0 var(--sun)}
.inside-top .name{font-family:var(--hand); font-weight:700; font-size:calc(var(--w)*.075); color:var(--blue); margin-top:.1em}
.msg{margin:0; font-family:var(--hand); font-size:calc(var(--w)*.058); line-height:1.25; max-width:24ch}
.sign{margin:0; font-family:var(--hand); font-weight:700; font-size:calc(var(--w)*.058); color:var(--red)}
[contenteditable]{border-radius:4px; cursor:text; min-width:2ch}
[contenteditable]:hover{background:rgba(244,182,63,.25)}

/* states */
.s-open .flap{transform:perspective(900px) rotateX(180deg); background:var(--paper-in); z-index:1}
.s-open .seal{opacity:0; transform:scale(.4); pointer-events:none}
.s-out .card{transform:translateY(calc(var(--w)*-.56))}
.s-read .card{transform:translateY(calc(var(--w)*.28)); z-index:6; transition:transform .7s cubic-bezier(.3,.7,.3,1), z-index 0s}
.s-read .env{transform:translateY(calc(var(--w)*1.1)) rotate(4deg); opacity:0}
.s-unfold .leaf{transform:rotateX(180deg)}

.foot{display:flex; flex-direction:column; align-items:center; gap:10px; min-height:70px; text-align:center}
.hint{margin:0; font-size:13px; color:var(--on-felt-dim); max-width:36ch; line-height:1.5}
.btn{font:500 13px var(--mono); letter-spacing:.06em; color:var(--felt-deep); background:var(--sun);
  border:0; border-radius:999px; padding:10px 18px; cursor:pointer}
.btn:hover{background:#ffc95c}
canvas{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:20}

@media (prefers-reduced-motion:reduce){
  .env,.flap,.card,.leaf,.seal,.s-read .card{transition-duration:.01s; transition-delay:0s}
}
</style>
</head>

<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function(){
  var stage=document.getElementById('stage'), seal=document.getElementById('seal'),
      again=document.getElementById('again'), hint=document.getElementById('hint'),
      cv=document.getElementById('fx'), ctx=cv.getContext('2d');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var busy=false, opened=false;
  function steps(list){ // [[class, add?, delay], ...]
    busy=true; var t=0;
    list.forEach(function(s){ t+=reduce?20:s[2];
      setTimeout(function(){ stage.classList.toggle(s[0],s[1]); if(s[3]) s[3](); },t); });
    setTimeout(function(){busy=false;},t+ (reduce?50:900));
  }
  function open(){
    if(busy||opened) return; opened=true;
    steps([['s-open',true,0],['s-out',true,550],['s-read',true,750],['s-unfold',true,750,function(){
      confetti(); hint.textContent='Tap the photo to see it full size.'; again.hidden=false; }]]);
  }
  function close(){
    if(busy||!opened) return; opened=false; again.hidden=true;
    hint.textContent='Tap the wax seal to open your card.';
    steps([['s-unfold',false,0],['s-read',false,850],['s-out',false,750],['s-open',false,650,function(){seal.focus({preventScroll:true});}]]);
  }
  seal.addEventListener('click',open);
  stage.addEventListener('click',function(e){ if(!opened && !e.target.closest('#card')) open(); });
  again.addEventListener('click',close);
  var photo=document.getElementById('photo'), lb=document.getElementById('lightbox');
  photo.addEventListener('click',function(){ lb.firstChild.src=photo.firstChild.src; lb.hidden=false; lb.classList.add('on'); lb.focus(); });
  lb.addEventListener('click',function(){ lb.hidden=true; lb.classList.remove('on'); photo.focus({preventScroll:true}); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!lb.hidden) lb.click(); });

  // confetti
  var parts=[], raf=0, colors=['#d6453d','#2f5d9e','#f4b63f','#ef7f9a','#fffdf6'];
  function size(){ var d=Math.min(window.devicePixelRatio||1,2); cv.width=innerWidth*d; cv.height=innerHeight*d; ctx.setTransform(d,0,0,d,0,0); }
  window.addEventListener('resize',size); size();
  function confetti(){
    if(reduce) return;
    var r=stage.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    for(var i=0;i<150;i++){
      var a=-Math.PI/2+(Math.random()-.5)*2.4, v=6+Math.random()*10;
      parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+Math.random()*7,h:3+Math.random()*5,
        r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:colors[i%colors.length],round:i%4===0});
    }
    if(!raf) raf=requestAnimationFrame(tick);
  }
  function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(function(p){ return p.y<innerHeight+30; });
    parts.forEach(function(p){
      p.vy+=.28; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
      if(p.round){ ctx.beginPath(); ctx.arc(0,0,p.h,0,6.28); ctx.fill(); }
      else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*1.3))+1);
      ctx.restore();
    });
    raf=parts.length?requestAnimationFrame(tick):0;
  }
})();
</script>
